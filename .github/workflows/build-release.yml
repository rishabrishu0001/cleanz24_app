name: Build & Sign Release AAB

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:   # Allow manual trigger from GitHub UI

jobs:
  build:
    name: Build Signed Android App Bundle
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up JDK 21 (required by Capacitor 8 & Android Gradle Plugin) ──
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── 3. Node.js + npm install ─────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      # ── 4. Build Vite production bundle ──────────────────────────────────────
      - name: Build web assets (Vite)
        run: npm run build
        env:
          VITE_API_URL: https://cleanz24-app.onrender.com

      # ── 5. Sync dist -> Android assets via Capacitor ──────────────────────────
      - name: Sync Capacitor to Android
        run: npx cap sync android

      # ── 6. Decode keystore if provided in secrets ────────────────────────────
      - name: Decode release keystore
        run: |
          if [ -n "${{ secrets.CLEANZ_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.CLEANZ_KEYSTORE_BASE64 }}" | base64 --decode > android/app/cleanz24-release.keystore
            echo "Keystore decoded from secret."
          else
            echo "Using repo-bundled release keystore."
          fi
          ls -la android/app/cleanz24-release.keystore

      # ── 7. Accept Android Licenses and Install SDK 36 ──────────────────────
      - name: Accept Android Licenses and Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      # ── 8. Grant Gradle execute permission ───────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 9. Build signed release AAB ──────────────────────────────────────────
      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace
        env:
          CLEANZ_KEYSTORE_PASSWORD: ${{ secrets.CLEANZ_KEYSTORE_PASSWORD }}
          CLEANZ_KEY_ALIAS: ${{ secrets.CLEANZ_KEY_ALIAS }}
          CLEANZ_KEY_PASSWORD: ${{ secrets.CLEANZ_KEY_PASSWORD }}

      # ── 10. Upload AAB as GitHub Actions artifact ────────────────────────────
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: cleanz24-release-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── 11. Print build summary ──────────────────────────────────────────────
      - name: Build Summary
        run: |
          echo "## Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| App ID | com.cleanz24.laundrycarspa |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | 1.0.7 (code 8) |" >> $GITHUB_STEP_SUMMARY
          echo "| Build # | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | cleanz24-release-${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the AAB from the Artifacts section and upload to Google Play Console." >> $GITHUB_STEP_SUMMARY
